<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KIRA STORE · Control de ventas</title>
<style>
:root{--bg:#faf6ee;--card:#fff;--ink:#241a1a;--mut:#7a6a68;--ac:#8f6a14;--on:#fff;--bd:#eadfd6;--ok:#1b6b45;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171212;--card:#221a1a;--ink:#f6ece8;--mut:#b5a29e;--ac:#e0b84f;--on:#1a1405;--bd:#3a2c2c;--ok:#4cc38a;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#171212;--card:#221a1a;--ink:#f6ece8;--mut:#b5a29e;--ac:#e0b84f;--on:#1a1405;--bd:#3a2c2c;--ok:#4cc38a;--bad:#ff8a80}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--bd);padding:8px 12px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.1em}.brand img{height:34px;border-radius:7px}.brand small{font-weight:500;letter-spacing:0;color:var(--mut);margin-left:auto}
nav{display:flex;gap:6px;margin-top:8px}.tb{flex:1;padding:9px 4px;border:1px solid var(--bd);background:var(--card);color:var(--ink);border-radius:10px;font-weight:700;cursor:pointer}.tb.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
main{max-width:720px;margin:auto;padding:12px}
h3{margin:18px 0 8px;font-size:1rem}.mu{color:var(--mut);font-size:.9rem}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.gr{flex:1;min-width:0;display:flex;flex-direction:column}.gr small{color:var(--mut)}
input,select{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);font-size:1rem}
.f{display:grid;grid-template-columns:1fr 1fr;gap:8px}.f .w{grid-column:1/-1}
.btn{border:0;background:var(--ac);color:var(--on);padding:12px 14px;border-radius:10px;font-weight:800;cursor:pointer;font-size:1rem}.btn.sm{padding:8px 10px;font-size:.85rem;white-space:nowrap}.btn.g{background:var(--card);color:var(--ink);border:1px solid var(--bd)}.btn.wa{background:#1fa855;color:#fff}.btn:disabled{opacity:.4;cursor:not-allowed}
.qty{display:flex;align-items:center;gap:8px}.qty button{width:32px;height:32px;border-radius:9px;border:1px solid var(--bd);background:var(--card);color:var(--ink);font-size:1.1rem;cursor:pointer}
.tot{display:flex;justify-content:space-between;font-size:1.25rem;font-weight:800;margin:12px 0}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.kp div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}.kp b{display:block;font-size:1.3rem}
.ip{width:84px}.bd{font-size:.72rem;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--bad);color:#fff;margin-left:6px}
#rc{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:50;overflow:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}#rc.on{display:block}
.rbox{max-width:420px;margin:auto;background:var(--card);border-radius:16px;padding:18px;text-align:center}.rbox .lg{height:56px;border-radius:10px}.rbox h2{margin:6px 0 0;letter-spacing:.12em}
.rbox p{text-align:left}.rbox table{width:100%;border-collapse:collapse;text-align:left}.rbox td{padding:6px 0;border-bottom:1px dashed var(--bd)}.rbox td:last-child{text-align:right;white-space:nowrap}.rbox tr.tot td{font-weight:800;font-size:1.1rem;border:0}
.an{color:var(--bad);font-weight:800;text-align:center!important;font-size:1.3rem;border:2px solid var(--bad);border-radius:8px}
.acts{display:grid;gap:8px;margin-top:14px}
.bol{font-size:.9rem}.bol th{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;padding:6px 4px;border-bottom:2px solid var(--ink);color:var(--mut);text-align:left}.bol td{padding:6px 4px}
.bol th:first-child,.bol td.c{text-align:center;width:48px}.bol th:nth-child(3),.bol th:nth-child(4),.bol td.r{text-align:right;white-space:nowrap}
.rbox .bol tfoot td{border-top:2px solid var(--ink)!important}
@page{size:A4;margin:12mm}
@media print{html,body{background:#fff!important;height:auto!important}body>*:not(#rc){display:none!important}body::before{display:none!important}
#rc{position:static!important;display:block!important;background:none;padding:0;overflow:visible}
.rbox{width:100%;max-width:none;margin:0;padding:0;background:#fff!important;border-radius:0;box-shadow:none;font-size:13pt}
.rbox,.rbox *{color:#000!important}.rbox .lg{height:90px}.rbox h2{font-size:24pt;margin:8px 0 4px}.rbox p{font-size:12pt}
.rbox .bol{font-size:12pt;margin:14px 0}.rbox .bol th{font-size:10pt;border-color:#000!important;padding:8px 6px}.rbox .bol td{padding:9px 6px;border-bottom:1px solid #999}
.rbox .bol tfoot td{border-top:2px solid #000!important;border-bottom:0;font-size:14pt}.acts{display:none!important}}
</style></head><body>
<header><div class="brand"><img class="lg" alt="">KIRA STORE<small>Control de ventas</small></div>
<nav><button class="tb" data-a="t" data-k="v">Vender</button><button class="tb" data-a="t" data-k="i">Inventario</button><button class="tb" data-a="t" data-k="h">Historial</button></nav></header>
<main>
<section id="sv"><input id="bq" type="search" placeholder="Buscar producto…" aria-label="Buscar"><h3>Productos</h3><div id="pl"></div>
<h3>Carrito</h3><div id="ct"></div>
<h3>Datos del comprador</h3><div class="f"><input id="cn" class="w" placeholder="Nombre completo *" autocomplete="off"><input id="cd" placeholder="DNI / RUC" inputmode="numeric"><input id="ct2" placeholder="Celular" inputmode="tel"><input id="ca" class="w" placeholder="Dirección (opcional)"><select id="cp" class="w"><option>Efectivo</option><option>Yape</option><option>Plin</option><option>Transferencia</option><option>Otro</option></select></div>
<div class="tot"><span>Total</span><span id="tt">S/ 0.00</span></div><button class="btn" id="em" style="width:100%" data-a="em" disabled>Emitir recibo</button></section>
<section id="si" hidden><div class="kp"><div>Unidades en stock<b id="k1"></b></div><div>Productos agotados<b id="k2"></b></div></div><div id="il"></div>
<h3>Agregar producto nuevo</h3><div class="f"><input id="nn" class="w" placeholder="Nombre del producto"><input id="ns" type="number" min="0" inputmode="numeric" placeholder="Stock"><input id="np" type="number" min="0" step="0.01" inputmode="decimal" placeholder="Precio S/"></div><button class="btn g" style="width:100%;margin-top:8px" data-a="np">Agregar al inventario</button></section>
<section id="sh" hidden><div class="kp"><div>Ventas realizadas<b id="h1"></b></div><div>Total vendido<b id="h2"></b></div></div><div id="hl"></div><button class="btn g" style="width:100%;margin-top:6px" data-a="csv">Descargar historial (CSV)</button><p class="mu" id="msg"></p></section>
</main>
<div id="rc"><div class="rbox"><div id="rb"></div><div class="acts"><button class="btn wa" data-a="wa">Enviar por WhatsApp</button><button class="btn g" data-a="cp" id="bc">Copiar texto</button><button class="btn g" data-a="pr">Imprimir / guardar PDF</button><button class="btn g" data-a="an" id="bx">Anular venta</button><button class="btn" data-a="x">Cerrar</button></div></div></div>

function save(){try{localStorage.setItem("kira_v1",JSON.stringify(S))}catch(e){}if(ref)ref.set({s:JSON.stringify(S)}).catch(()=>{})}

function render(){document.querySelectorAll(".tb").forEach(b=>b.classList.toggle("on",b.dataset.k===tab));["v","i","h"].forEach(t=>$("s"+t).hidden=t!==tab);if(tab==="v")rV();if(tab==="i")rI();if(tab==="h")rH()}
function rV(){const q=$("bq").value.trim().toLowerCase();
$("pl").innerHTML=S.p.map((p,k)=>({p,k})).filter(o=>o.p.n.toLowerCase().includes(q)).map(({p,k})=>{const l=p.s-(cart[k]||0);return `<div class="row"><div class="gr"><b>${esc(p.n)}</b><small>${m(p.pr)} · ${l>0?"Stock: "+l:"Sin stock"}</small></div><button class="btn sm" data-a="add" data-k="${k}" ${l<1?"disabled":""}>+ Agregar</button></div>`}).join("")||'<p class="mu">Sin resultados.</p>';
const ids=Object.keys(cart).filter(k=>cart[k]>0);let t=0;
$("ct").innerHTML=ids.length?ids.map(k=>{const p=S.p[k];t+=cart[k]*p.pr;return `<div class="row"><div class="gr"><b>${esc(p.n)}</b><small>${m(p.pr)} × ${cart[k]} = ${m(cart[k]*p.pr)}</small></div><div class="qty"><button data-a="minus" data-k="${k}">−</button><b>${cart[k]}</b><button data-a="add" data-k="${k}" ${cart[k]>=p.s?"disabled":""}>+</button></div></div>`}).join(""):'<p class="mu">Aún no agregaste productos.</p>';
$("tt").textContent=m(t);$("em").disabled=!ids.length||!$("cn").value.trim()}
function rI(){$("k1").textContent=S.p.reduce((a,p)=>a+p.s,0);$("k2").textContent=S.p.filter(p=>p.s<1).length;
$("il").innerHTML=S.p.map((p,k)=>`<div class="row"><div class="gr"><b>${esc(p.n)}${p.s<1?'<span class="bd">Agotado</span>':p.s===1?'<span class="bd">Última unidad</span>':""}</b><small>Stock · Precio S/</small></div><input class="ip" type="number" min="0" inputmode="numeric" value="${p.s}" data-k="${k}" data-f="s" aria-label="Stock"><input class="ip" type="number" min="0" step="0.01" inputmode="decimal" value="${p.pr}" data-k="${k}" data-f="pr" aria-label="Precio"></div>`).join("")}
function rH(){const ok=S.v.filter(v=>!v.x);$("h1").textContent=ok.length;$("h2").textContent=m(ok.reduce((a,v)=>a+v.t,0));
$("hl").innerHTML=S.v.slice().reverse().map(v=>`<div class="row" data-a="open" data-k="${v.n}" style="cursor:pointer"><div class="gr"><b>${pad(v.n)} · ${esc(v.c.n)}${v.x?'<span class="bd">Anulado</span>':""}</b><small>${new Date(v.f).toLocaleString("es-PE")} · ${esc(v.c.p)}</small></div><b>${m(v.t)}</b></div>`).join("")||'<p class="mu">Todavía no hay ventas.</p>'}
function rt(v){return ["KIRA STORE","Recibo "+pad(v.n),new Date(v.f).toLocaleString("es-PE"),"","Cliente: "+v.c.n,v.c.d?"Doc.: "+v.c.d:null,v.c.t?"Tel.: "+v.c.t:null,v.c.a?"Dirección: "+v.c.a:null,"",...v.it.map(i=>i.q+" x "+i.n+" (c/u "+m(i.pr)+") = "+m(i.q*i.pr)),"","TOTAL: "+m(v.t),"Pago: "+v.c.p,"","¡Gracias por tu compra!","WhatsApp +51 974 755 053 · TikTok @kira.store25"].filter(x=>x!==null).join("\n")}
function showR(v){cur=v;ask=false;$("rb").innerHTML=`<img class="lg" src="${EMB}" alt=""><h2>KIRA STORE</h2><p class="mu" style="text-align:center">Recibo ${pad(v.n)}<br>${new Date(v.f).toLocaleString("es-PE")}</p>${v.x?'<p class="an">ANULADO</p>':""}<p><b>Cliente:</b> ${esc(v.c.n)}${v.c.d?"<br><b>Doc.:</b> "+esc(v.c.d):""}${v.c.t?"<br><b>Tel.:</b> "+esc(v.c.t):""}${v.c.a?"<br><b>Dirección:</b> "+esc(v.c.a):""}</p><table class="bol"><thead><tr><th>Cant.</th><th>Descripción</th><th>P. unit.</th><th>P. total</th></tr></thead><tbody>${v.it.map(i=>`<tr><td class="c">${i.q}</td><td>${esc(i.n)}</td><td class="r">${m(i.pr)}</td><td class="r">${m(i.q*i.pr)}</td></tr>`).join("")}</tbody><tfoot><tr class="tot"><td colspan="3">TOTAL</td><td class="r">${m(v.t)}</td></tr></tfoot></table><p class="mu">Pago: ${esc(v.c.p)}<br>¡Gracias por tu compra!<br>WhatsApp +51 974 755 053 · TikTok @kira.store25</p>`;
$("bx").hidden=!!v.x;$("bx").textContent="Anular venta";$("bc").textContent="Copiar texto";$("rc").classList.add("on")}
document.addEventListener("click",async e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,k=b.dataset.k;
if(a==="t"){tab=k;render()}
else if(a==="add"){const p=S.p[k];if((cart[k]||0)<p.s)cart[k]=(cart[k]||0)+1;rV()}
else if(a==="minus"){cart[k]=Math.max(0,(cart[k]||0)-1);rV()}
else if(a==="em"){const ids=Object.keys(cart).filter(x=>cart[x]>0);if(!ids.length||!$("cn").value.trim())return;
const it=ids.map(x=>{const p=S.p[x];p.s-=cart[x];return{pid:+x,n:p.n,q:cart[x],pr:p.pr}});
const v={n:S.nx++,f:new Date().toISOString(),c:{n:$("cn").value.trim(),d:$("cd").value.trim(),t:$("ct2").value.trim(),a:$("ca").value.trim(),p:$("cp").value},it,t:it.reduce((s,i)=>s+i.q*i.pr,0),x:0};
S.v.push(v);cart={};["cn","cd","ct2","ca"].forEach(i=>$(i).value="");save();rV();showR(v)}
else if(a==="np"){const n=$("nn").value.trim(),s=parseInt($("ns").value),p=parseFloat($("np").value);if(!n||isNaN(s)||isNaN(p))return;S.p.push({id:S.p.length,n,s:Math.max(0,s),pr:p});["nn","ns","np"].forEach(i=>$(i).value="");save();rI()}
else if(a==="open"){showR(S.v.find(v=>v.n==k))}
else if(a==="x"){$("rc").classList.remove("on");render()}
else if(a==="pr"){window.print()}
else if(a==="cp"){try{await navigator.clipboard.writeText(rt(cur));$("bc").textContent="¡Copiado!"}catch(_){$("bc").textContent="No se pudo copiar"}}
else if(a==="wa"){const d=(cur.c.t||"").replace(/\D/g,""),num=d.length===9?"51"+d:d;window.open("https://wa.me/"+num+"?text="+encodeURIComponent(rt(cur)),"_blank")}
else if(a==="an"){if(!ask){ask=true;$("bx").textContent="¿Seguro? Toca otra vez para anular";return}
cur.x=1;cur.it.forEach(i=>{if(S.p[i.pid])S.p[i.pid].s+=i.q});save();showR(cur)}
else if(a==="csv"){const q=s=>'"'+String(s).replace(/"/g,'""')+'"';const rows=[["N°","Fecha","Cliente","Documento","Celular","Pago","Detalle","Total","Estado"].map(q).join(",")].concat(S.v.map(v=>[pad(v.n),new Date(v.f).toLocaleString("es-PE"),v.c.n,v.c.d,v.c.t,v.c.p,v.it.map(i=>i.q+" x "+i.n).join("; "),v.t.toFixed(2),v.x?"Anulado":"Vigente"].map(q).join(",")));
try{const l=document.createElement("a");l.href=URL.createObjectURL(new Blob(["\ufeff"+rows.join("\n")],{type:"text/csv"}));l.download="ventas_kira_store.csv";document.body.appendChild(l);l.click();l.remove();$("msg").textContent=""}catch(_){$("msg").textContent="No se pudo descargar el archivo."}}});
document.addEventListener("change",e=>{const t=e.target;if(!t.dataset.f)return;const p=S.p[t.dataset.k],v=parseFloat(t.value);if(isNaN(v)||v<0){rI();return}p[t.dataset.f]=t.dataset.f==="s"?Math.floor(v):v;save();rI()});
$("bq").oninput=rV;$("cn").oninput=rV;render();
</script></body></html>
